<!doctype html>
<meta charset="utf-8">
<title>SoleCraftPH promo 20s</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../fonts/bebas.css">
<style>
  html, body { margin: 0; background: #111; overflow: hidden; }
  #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
  #ground, #stage, #fx, #top { position: absolute; inset: 0; }
  #stage, #top { perspective: 1500px; perspective-origin: 960px 540px; }
  #world, #topworld { position: absolute; inset: 0; transform-style: preserve-3d; }
  #fx { pointer-events: none; overflow: hidden; }
  .o { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform; }
  .p3 { transform-style: preserve-3d; }
  .kl { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; transform-origin: 0 0; }
  .kl > div { will-change: transform; }
  .sub { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; transform-origin: 0 0;
         font: 500 38px/1.3 Inter, sans-serif; color: #6E6A60; padding-right: 20px; }
  .shoe img, .shoe canvas { width: 100%; height: 100%; display: block; }
  .shadow { position: absolute; left: 0; top: 0; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,18,14,.35), rgba(20,18,14,0)); }
  /* phone */
  .phone { width: 360px; height: 780px; }
  .pf { position: absolute; inset: 0; border-radius: 46px; backface-visibility: hidden; background: #0B0B0A; }
  .pf.front { transform: translateZ(5px); box-shadow: 0 40px 80px -30px rgba(20,18,14,.45), 0 10px 24px -10px rgba(20,18,14,.3); }
  .pf.front canvas { position: absolute; left: 10px; top: 10px; width: 340px; height: 760px; border-radius: 36px; }
  .pf.back { transform: translateZ(-5px) rotateY(180deg); background: linear-gradient(160deg, #262624, #121211 60%); display: grid; place-items: center; }
  .pf.back .lens { position: absolute; left: 26px; top: 26px; width: 92px; height: 120px; border-radius: 30px; background: #1b1b1a; box-shadow: inset 0 0 0 2px #2c2c2a; }
  .pf.back .lens::before, .pf.back .lens::after { content: ""; position: absolute; left: 22px; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #3a3f48, #0a0a0a 60%); }
  .pf.back .lens::before { top: 8px; } .pf.back .lens::after { top: 64px; }
  .edge { position: absolute; background: #2b2b29; }
  .edge.l { left: -5px; top: 40px; width: 10px; height: 700px; transform: rotateY(90deg); }
  .edge.r { left: 355px; top: 40px; width: 10px; height: 700px; transform: rotateY(90deg); }
  .edge.t { left: 40px; top: -5px; width: 280px; height: 10px; transform: rotateX(90deg); }
  .edge.b { left: 40px; top: 775px; width: 280px; height: 10px; transform: rotateX(90deg); }
  /* laptop */
  .lid { position: absolute; left: 0; top: 0; width: 940px; height: 600px; border-radius: 22px; background: #1A1A19; transform-origin: 50% 100%; box-shadow: 0 50px 90px -40px rgba(20,18,14,.5); }
  .lid img { position: absolute; left: 20px; top: 20px; width: 900px; height: 562px; border-radius: 6px; }
  .deck { position: absolute; left: -40px; top: 600px; width: 1020px; height: 560px; border-radius: 0 0 26px 26px; transform-origin: 50% 0; transform: rotateX(90deg);
          background: linear-gradient(#D9D5CC, #CFCBC2); }
  .deck::before { content: ""; position: absolute; left: 90px; top: 50px; width: 840px; height: 290px; border-radius: 10px; background: repeating-linear-gradient(90deg, #C3BFB5 0 54px, #CFCBC2 54px 60px); opacity: .7; }
  .deck::after { content: ""; position: absolute; left: 380px; top: 370px; width: 260px; height: 150px; border-radius: 12px; background: #C8C4BA; }
  .card { width: 525px; height: 109px; border-radius: 24px; background: #fff; box-shadow: 0 24px 50px -20px rgba(20,18,14,.35), 0 4px 12px -4px rgba(20,18,14,.12); overflow: hidden; }
  .card div { width: 100%; height: 100%; background-repeat: no-repeat; }
  .url { font: 600 36px Inter, sans-serif; color: #FAF9F6; }
</style>
<div id="frame">
  <div id="ground"></div>
  <div id="stage"><div id="world"></div></div>
  <div id="fx"></div>
  <div id="top"><div id="topworld"></div></div>
</div>
<script type="module" src="film.js"></script>
